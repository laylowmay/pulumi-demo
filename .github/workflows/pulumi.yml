name: Pulumi

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: pulumi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    name: Pulumi Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize Pulumi stack
        run: |
          pulumi stack select dev 2>/dev/null || \
            pulumi stack init dev \
              --secrets-provider="gcpkms://projects/${{ secrets.GCP_PROJECT_ID }}/locations/us-central1/keyRings/pulumi-keyring/cryptoKeys/pulumi-secrets-key"
        env:
          PULUMI_BACKEND_URL: gs://your-pulumi-state-bucket

      - name: Pulumi Preview
        uses: pulumi/actions@v7
        with:
          command: preview
          stack-name: dev
          cloud-url: gs://your-pulumi-state-bucket
          comment-on-pr: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # secrets-provider intentionally removed — stack already initialized above

  deploy:
    name: Pulumi Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize Pulumi stack
        run: |
          pulumi stack select dev 2>/dev/null || \
            pulumi stack init dev \
              --secrets-provider="gcpkms://projects/${{ secrets.GCP_PROJECT_ID }}/locations/us-central1/keyRings/pulumi-keyring/cryptoKeys/pulumi-secrets-key"
        env:
          PULUMI_BACKEND_URL: gs://your-pulumi-state-bucket

      - name: Pulumi Up
        uses: pulumi/actions@v7
        with:
          command: up
          stack-name: dev
          cloud-url: gs://your-pulumi-state-bucket
          # secrets-provider intentionally removed — stack already initialized above
